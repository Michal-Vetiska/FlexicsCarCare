[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  external_node_modules = ["@netlify/blobs"]

[dev]
  command = "npm run dev:client"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# API → serverless functions (splat zachová cestu za /api/)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Uploadované obrázky z Blobs
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/media/:splat"
  status = 200
  force = true

# Vue SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[dev]
  command = "npm run dev:client"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Zachytí /api a /uploads PŘED SPA fallbackem (Functions v2 config.path).
# Důležité: NEpřesměrovávat na /.netlify/functions — to zapne Lambda mode a rozbije Blobs.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
